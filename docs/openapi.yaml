      - allocated_at
      properties:
        writer_id:
          type: string
          format: uuid
          nullable: true
          description: Null for an empty slot.
        allocated_at: *id003
    AllocationSummary:
      type: object
      description: Reader subscription state. When no subscription exists, `subscription_id`/`billing_cycle_start`
        are null and status is `none`.
      required:
      - subscription_id
      - status
      - billing_cycle_start
      - change_credits_remaining
      - change_credits_per_cycle
      - total_slots
      - allocated_slots
      - empty_slots
      - allocations
      properties:
        subscription_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          example: active
        billing_cycle_start: *id003
        change_credits_remaining:
          type: integer
        change_credits_per_cycle:
          type: integer
        total_slots:
          type: integer
          example: 5
        allocated_slots:
          type: integer
        empty_slots:
          type: integer
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationEntry'
    AllocationResult:
      type: object
      required:
      - success
      - credits_spent
      - allocations
      properties:
        success:
          type: boolean
        credits_spent:
          type: integer
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationEntry'
    SubscribeRequest:
      type: object
      properties:
        payment_method_id:
          type: string
          default: pm_mock_default
    AssignRequest:
      type: object
      required:
      - writer_id
      properties:
        writer_id:
          type: string
          format: uuid
    SwapRequest:
      type: object
      required:
      - current_writer_id
      - new_writer_id
      properties:
        current_writer_id:
          type: string
          format: uuid
        new_writer_id:
          type: string
          format: uuid
    WebhookRequest:
      type: object
      description: Internal `{event_type, payload}` shape or Stripe `{type, data.object}`
        shape. Unknown subscription ids are accepted without effect.
    WebhookResult:
      type: object
      required:
      - received
      properties:
        received:
          type: boolean
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    Readiness:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          description: database / redis / migrations, each {ok, detail}.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login.
