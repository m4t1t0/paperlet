# Mypy configuration (`invoke typecheck` runs `mypy backend` from the repo root).
# The codebase imports `backend.src.*` from the root, matched by explicit
# `backend/__init__.py` + `backend/src/__init__.py` package markers.

[mypy]
warn_unused_ignores = True

# Third-party libs without stubs or py.typed markers.
[mypy-celery.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
